[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
raft = { path = "crates/raft" }
kv = { path = "crates/kv" }
sys = { path = "crates/sys" }
node = { path = "crates/node" }
sim = { path = "crates/sim" }
lincheck = { path = "crates/lincheck" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"
